# subproperties, imports, or original editorial metadata. No individuals or
# custom datatypes are declared in the source.
# Four previously unresolved property ranges are proposed from their names for this build.
# Original broad rdfs:Literal ranges are narrowed to proposed XSD datatypes for publication.
# The context URL points to the published version of this draft on GitHub Pages.
